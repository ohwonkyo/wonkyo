{% extends 'base.html' %}
{% block title %}{{ survey[0] }}{% endblock %}
{% block content %}
<h1>{{ survey[0] }}</h1>
<form method="post">
  {% for qid, text in questions %}
  <div class="mb-3">
    <label class="form-label">{{ text }}</label>
    <input type="text" name="{{ qid }}" class="form-control" required>
  </div>
  {% endfor %}
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
{% endblock %}
